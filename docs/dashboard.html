<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra-Low-Latency Engine Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(23, 28, 38, 0.7);
            --accent-color: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 242, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.05) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-color), #7c3aed);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
            font-size: 0.875rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--danger-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--danger-color);
            animation: pulse 2s infinite;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto auto;
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .main-stat-card {
            grid-column: span 4;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out;
        }

        .main-stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, var(--accent-color), transparent 30%);
            animation: rotate 10s linear infinite;
            opacity: 0.1;
            z-index: -1;
        }

        .stat-value-large {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5rem;
            font-weight: 700;
            color: var(--accent-color);
            text-shadow: 0 0 40px var(--accent-glow);
            margin-bottom: 0.5rem;
        }

        .stat-label-large {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: transform 0.3s ease, border-color 0.3s ease;
            animation: fadeInUp 0.8s ease-out backwards;
        }

        .stat-card:nth-child(2) { animation-delay: 0.1s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.3s; }
        .stat-card:nth-child(5) { animation-delay: 0.4s; }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 242, 255, 0.3);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .unit {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-left: 0.25rem;
        }

        .chart-container {
            grid-column: span 4;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            margin-top: 1rem;
            height: 400px;
            animation: fadeInUp 0.8s ease-out backwards;
            animation-delay: 0.5s;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .main-stat-card, .chart-container {
                grid-column: span 2;
            }
        }

        @media (max-width: 640px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .main-stat-card, .chart-container, .stat-card {
                grid-column: span 1;
            }
            .stat-value-large {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <div class="logo-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
            </div>
            <h1>ULTRA-LOW LATENCY ENGINE</h1>
        </div>
        <div class="status-badge" id="conn-status">
            <div class="status-dot"></div>
            CONNECTING...
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- Main p99 Stat -->
        <div class="main-stat-card">
            <div class="stat-value-large" id="p99">---</div>
            <div class="stat-label-large">p99 Matching Latency</div>
        </div>

        <!-- p50 -->
        <div class="stat-card">
            <div class="stat-label">p50 Latency</div>
            <div class="stat-value"><span id="p50">---</span><span class="unit">ns</span></div>
        </div>

        <!-- p999 -->
        <div class="stat-card">
            <div class="stat-label">p99.9 Latency</div>
            <div class="stat-value"><span id="p999">---</span><span class="unit">ns</span></div>
        </div>

        <!-- Orders/sec -->
        <div class="stat-card">
            <div class="stat-label">Throughput</div>
            <div class="stat-value"><span id="ops">---</span><span class="unit">ops/s</span></div>
        </div>

        <!-- Uptime -->
        <div class="stat-card">
            <div class="stat-label">Uptime</div>
            <div class="stat-value" id="uptime">--:--:--</div>
        </div>

        <!-- Sparkline Chart -->
        <div class="chart-container">
            <canvas id="latencyChart"></canvas>
        </div>
    </div>

    <script>
        const EC2_URL = 'http://54.123.45.67:8080/metrics';
        const history = []; // rolling 60 samples
        const labels = Array.from({length: 60}, (_, i) => i);

        // Chart.js Setup
        const ctx = document.getElementById('latencyChart').getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, 'rgba(0, 242, 255, 0.2)');
        gradient.addColorStop(1, 'rgba(0, 242, 255, 0)');

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'p99 Latency (ns)',
                    data: history,
                    borderColor: '#00f2ff',
                    borderWidth: 3,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { display: false },
                    y: {
                        beginAtZero: false,
                        grid: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        },
                        ticks: {
                            color: '#94a3b8',
                            font: { family: 'JetBrains Mono' }
                        }
                    }
                },
                animations: false
            }
        });

        async function poll() {
            const statusBadge = document.getElementById('conn-status');
            const statusDot = statusBadge.querySelector('.status-dot');
            
            // PERMANENT SOLUTION: Use allorigins proxy to bypass HTTPS Mixed Content security block
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(EC2_URL)}&cb=${Date.now()}`;
            
            try {
                const r = await fetch(proxyUrl);
                if (!r.ok) throw new Error('Proxy or Network error');
                
                const d = await r.json();

                document.getElementById('p99').textContent = d.p99_ns + ' ns';
                document.getElementById('p50').textContent = d.p50_ns;
                document.getElementById('p999').textContent = d.p999_ns;
                document.getElementById('ops').textContent = d.orders_per_sec.toLocaleString();
                
                if (d.uptime_seconds) {
                    const h = Math.floor(d.uptime_seconds / 3600).toString().padStart(2, '0');
                    const m = Math.floor((d.uptime_seconds % 3600) / 60).toString().padStart(2, '0');
                    const s = (d.uptime_seconds % 60).toString().padStart(2, '0');
                    document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
                }

                history.push(d.p99_ns);
                if (history.length > 60) history.shift();
                chart.data.datasets[0].data = [...history];
                chart.update('none');

                statusBadge.style.color = 'var(--success-color)';
                statusBadge.style.background = 'rgba(16, 185, 129, 0.1)';
                statusBadge.style.borderColor = 'rgba(16, 185, 129, 0.2)';
                statusDot.style.backgroundColor = 'var(--success-color)';
                statusDot.style.boxShadow = '0 0 10px var(--success-color)';
                statusBadge.innerHTML = '<div class="status-dot" style="background-color: var(--success-color); box-shadow: 0 0 10px var(--success-color); animation: pulse 2s infinite;"></div> CONNECTED';
            } catch(e) {
                console.error("Polling error:", e);
                statusBadge.style.color = 'var(--danger-color)';
                statusBadge.style.background = 'rgba(239, 68, 68, 0.1)';
                statusBadge.style.borderColor = 'rgba(239, 68, 68, 0.2)';
                statusDot.style.backgroundColor = 'var(--danger-color)';
                statusDot.style.boxShadow = '0 0 10px var(--danger-color)';
                statusBadge.innerHTML = '<div class="status-dot"></div> RECONNECTING...';
            }
        }

        setInterval(poll, 1000);
        poll(); // immediate first call
    </script>
</body>
</html>
